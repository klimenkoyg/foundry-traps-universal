<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600">
  <title>Западня · заставка</title>
  <!-- ?lang=en — английский текст (banner.js). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/styles/fonts.css">
  <style>
    :root { --gold: #dbb76d; --gold-hi: #f0d79c; --ink: #f4ecde; --ink-2: #d6c9b3; --ink-3: #a99a82; --bg: #0e0c0a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    .banner { position: relative; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); }
    canvas { position: absolute; inset: 0; display: block; }
    /* Читаемость текста: слева темнее, карта проступает справа. */
    .shade { position: absolute; inset: 0; background:
      linear-gradient(90deg, rgb(10 8 6 / 0.97) 0%, rgb(10 8 6 / 0.9) 30%, rgb(10 8 6 / 0.35) 52%, rgb(10 8 6 / 0) 66%),
      radial-gradient(ellipse 120% 100% at 75% 50%, transparent 55%, rgb(6 5 4 / 0.75) 100%); }
    .frame { position: absolute; inset: 18px; border: 1px solid rgb(219 183 109 / 0.45); box-shadow: inset 0 0 0 5px rgb(14 12 10 / 0.9), inset 0 0 0 6px rgb(219 183 109 / 0.18); pointer-events: none; }
    .copy { position: absolute; left: 104px; top: 50%; transform: translateY(-50%); width: 800px; color: var(--ink); }
    .mark { display: flex; align-items: center; gap: 22px; }
    .medal { flex: 0 0 auto; display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%;
      border: 1.5px solid var(--gold); color: var(--gold-hi); font-size: 40px;
      background: radial-gradient(circle at 50% 35%, #3a2a17, #0b0907 78%);
      box-shadow: 0 0 0 4px #0e0b09, 0 0 0 5.5px rgb(219 183 109 / 0.4), 0 12px 30px rgb(0 0 0 / 0.6); }
    h1 { margin: 0; font-family: "Cormorant SC", serif; font-weight: 700; font-size: 124px; line-height: 0.9; letter-spacing: 0.01em; color: var(--gold-hi);
      text-shadow: 0 2px 0 #3b2a14, 0 10px 40px rgb(0 0 0 / 0.7); }
    .sub { margin: 10px 0 0 4px; font-family: "Cormorant SC", serif; font-weight: 700; font-size: 38px; letter-spacing: 0.08em; color: var(--gold); }
    .rule { width: 420px; height: 1px; margin: 34px 0 30px; background: linear-gradient(90deg, var(--gold), rgb(219 183 109 / 0)); }
    .tag { margin: 0; font-family: "Alegreya", serif; font-size: 36px; line-height: 1.2; color: var(--ink); }
    .lead { margin: 16px 0 0; max-width: 40ch; font-family: "Alegreya Sans", sans-serif; font-size: 25px; line-height: 1.4; color: var(--ink-2); }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 38px; }
    /* Английское название длиннее «Западни». */
    .en h1 { font-size: 100px; white-space: nowrap; }
    [hidden] { display: none !important; }
    .meta span { padding: 6px 14px; border: 1px solid rgb(219 183 109 / 0.4); border-radius: 999px; background: rgb(14 12 10 / 0.7);
      font-family: "Alegreya Sans", sans-serif; font-size: 19px; font-weight: 500; color: var(--ink-2); }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <canvas id="map" width="1600" height="900"></canvas>
    <div class="shade"></div>
    <div class="copy">
      <div class="mark">
        <span class="medal"><i class="fa-solid fa-skull-crossbones"></i></span>
        <div>
          <h1 data-t="h1">Западня</h1>
          <p class="sub" data-t="sub">Trap Library · Universal</p>
        </div>
      </div>
      <div class="rule"></div>
      <p class="tag" data-t="tag">Ловушки для любой системы в Foundry VTT</p>
      <p class="lead" data-t="lead">Перетащи ловушку на карту — дальше она сработает сама: анимация, звук, спасброски и урон.</p>
      <div class="meta" data-t="meta"><span>18 ловушек</span><span>Foundry v13–v14</span><span>бесплатно</span><span>RU · EN</span></div>
    </div>
    <div class="frame"></div>
  </div>
  <script type="module" src="banner.js"></script>
</body>
</html>
